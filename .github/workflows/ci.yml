name: CI

# Runs the same verification steps AGENTS.md requires before any change is merged:
# type check, unit tests, production build, and Drizzle migration consistency.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js (from .nvmrc)
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build (Vite + serverless dispatcher)
        run: npm run build

      - name: Drizzle migration snapshot check
        run: npx drizzle-kit check

      - name: Detect schema changes without a migration
        run: |
          npx drizzle-kit generate
          if [ -n "$(git status --porcelain netlify/database/migrations)" ]; then
            echo "::error::src/db/schema.ts changed without a committed migration. Run 'npx drizzle-kit generate' and commit the result."
            git status --porcelain netlify/database/migrations
            exit 1
          fi

      - name: Repository hygiene
        run: |
          git diff --check HEAD
          if git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v '^\.env\.example$'; then
            echo "::error::An environment file is tracked by git. Remove it and keep only .env.example."
            exit 1
          fi
          if git ls-files | grep -E '^(dist|server-build/dispatcher\.mjs)'; then
            echo "::error::Build artifacts are tracked by git."
            exit 1
          fi
